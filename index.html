/* =====================================================================
   6. 戦術（戦闘）レイヤー  ― Two Crowns のルール体系を踏襲
      ・ターン制：移動→攻撃（1兵1回）／村落で部隊を回復
      ・兵科の三すくみ、地形の移動コストと防御、隣接攻撃の反撃
      ・本営を壊す／士気が尽きる／兵がいなくなると決着
      ・長期化すると攻城と消耗が加速する（膠着防止）
   ===================================================================== */
var BT=null;
var BMAX_TURN=26, RAMP_FROM=14, RAMP_STEP=0.10, RAMP_MAX=3.2;

/* 陣営は p=攻め手（盤面下） / e=守り手（盤面上）。人間が守り手のときは盤面を180度回転して見せる。 */
function makeBattle(fromKey,toKey,commit,attGen,auto,attComp){
  var from=S.cities[fromKey], to=S.cities[toKey];
  var att=from.owner, def=to.owner;
  var meAtk=(att===S.me);
  var siege=(to.walls>=3);
  var defGen=(def===S.me)?pickGenForCity(def,toKey):aiBestGeneral(def,toKey);
  var atkGen=(att===S.me)?attGen:aiBestGeneral(att,fromKey);
  var defCom=Math.max(6,to.garr);
  var B={
    seed:((S.seed^(hashStr(fromKey)*7919+hashStr(toKey)*104729+S.turn*31+ri(997)))>>>0),
    city:toKey, from:fromKey, att:att, def:def, attIsMe:meAtk, meSide:meAtk?'p':'e',
    auto:!!auto, siege:siege, walls:to.walls, link:(linkInfo(fromKey,toKey)||{t:'plain'}).t,
    cols:siege?15:13, rows:siege?11:9, tiles:[], units:[], uid:1,
    basePos:{p:null,e:null}, baseHp:{p:16,e:16+to.walls*4},
    morale:{p:0,e:0}, cap:{p:0,e:0}, commit:{p:commit,e:defCom}, losses:{p:0,e:0},
    tac:{p:1,e:1}, gen:{p:atkGen,e:defGen}, qmul:{p:1,e:1},
    turn:1, maxTurn:BMAX_TURN, sel:null, skill:null, log:[], over:null, undo:[]
  };
  B.qmul.p=qualityOf(att,fromKey,atkGen);
  B.qmul.e=qualityOf(def,toKey,defGen);
  B.cap.p=battleUnitCount(commit);
  B.cap.e=battleUnitCount(defCom);
  B.morale.p=initMorale(att,commit,atkGen);
  B.morale.e=initMorale(def,defCom,defGen);
  genBattleMap(B);
  deployInitial(B,'p',meAtk?attComp:null); deployInitial(B,'e',!meAtk?attComp:null);
  blog(B,'b_start',{c:toKey});
  return B;
}
function pickGenForCity(stateKey,cityKey){
  var inCity=gensAt(cityKey).filter(function(g){ return S.gen[g.k].side===stateKey; });
  return inCity.length?inCity[0].k:null;
}
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h>>>0; }
function qualityOf(stateKey,cityKey,genKey){
  var d=S.cities[cityKey], q=1+0.04*d.train+0.002*S.st[stateKey].stab;
  if(genKey){ var g=genData(genKey); if(g) q+=0.01*(g.lead+g.war); }
  return q;
}
function initMorale(stateKey,commit,genKey){
  var m=62+Math.min(22,commit*0.6)+(genKey?(genData(genKey)||{lead:5}).lead*2:0)+S.st[stateKey].stab*0.15;
  return Math.round(clamp(m,45,100));
}

/* ---------- 盤面生成（攻め手＝下／守り手＝上・守り手は城壁で囲まれる） ---------- */
function genBattleMap(B){
  var W=B.cols, H=B.rows, R=seedRnd(B.seed), y, x, row;
  for(y=0;y<H;y++){ row=[]; for(x=0;x<W;x++) row.push({t:'plain',owner:null}); B.tiles.push(row); }
  function setT(px,py,t){ if(px>=0&&py>=0&&px<W&&py<H) B.tiles[py][px].t=t; }
  function keep(px,py){ return (py>=H-3)||(py<=1); }         // 本営まわりは整地する
  function spread(kind,count){
    var guard=0;
    while(count>0&&guard++<900){
      var px=ri(W), py=ri(H);
      if(B.tiles[py][px].t!=='plain'||keep(px,py)) continue;
      setT(px,py,kind); count--;
    }
  }
  var lk=B.link||'plain', area=W*H, midx=W>>1;
  if(lk==='mountain'){ spread('mountain',Math.round(area*0.16)); spread('forest',Math.round(area*0.10)); }
  else if(lk==='hill'){ spread('forest',Math.round(area*0.15)); spread('mountain',Math.round(area*0.06)); }
  else if(lk==='plain'){ spread('forest',Math.round(area*0.08)); }
  else { spread('forest',Math.round(area*0.07)); }
  // 川沿いの戦場：河が盤面を分け、橋は必ず残す
  if(lk==='river'){
    var ry=3+ri(Math.max(1,H-6)), bridge=1+ri(Math.max(1,W-3));
    for(var bx=0;bx<W;bx++){
      if(bx===bridge||bx===bridge+1) continue;
      if(B.tiles[ry][bx].t==='plain') setT(bx,ry,'water');
    }
  }
  spread('village',2);
  B.tiles[H-2][midx].t='base'; B.tiles[H-2][midx].owner='p'; B.basePos.p={x:midx,y:H-2};
  B.tiles[1][midx].t='base';   B.tiles[1][midx].owner='e';   B.basePos.e={x:midx,y:1};
  if(B.siege){
    var x0=Math.max(0,midx-4), x1=Math.min(W-1,midx+4), y0=0, y1=4;
    for(var yy=y0;yy<=y1;yy++) for(var xx=x0;xx<=x1;xx++){
      if(!(yy===y1||xx===x0||xx===x1)) continue;             // 城壁は前側（攻め手側）に弧を描く
      if(B.tiles[yy][xx].t==='base'||!isFinite(TERRAIN[B.tiles[yy][xx].t].cost)) continue;
      setT(xx,yy,'wall');
    }
    var gy=y1, g1=clamp(midx-3,x0+1,x1-1), g2=clamp(midx+3,x0+1,x1-1);
    if(B.tiles[gy][g1].t==='wall') setT(g1,gy,'gate');
    if(B.tiles[gy][g2].t==='wall') setT(g2,gy,'gate');
    for(var iy=0;iy<y1;iy++) for(var ix=x0;ix<=x1;ix++){
      var tt=B.tiles[iy][ix];
      if(tt.t==='plain'||tt.t==='village') tt.walled=true;   // 城内は防御+2
    }
    setT(midx-1,H-2,'gate'); setT(midx+1,H-2,'gate');        // 攻め手本営の前哨門
  }
  ensurePaths(B);
}
function ensurePaths(B){
  var W=B.cols,H=B.rows;
  var a=B.basePos.p,b=B.basePos.e;
  if(!walkableBetween(a,b,'inf',B)) {
    // 塞がっていれば中央の列を平野に開通させる
    var midx=W>>1;
    for(var y=0;y<H;y++){ if(B.tiles[y][midx].t==='water'||B.tiles[y][midx].t==='wall') B.tiles[y][midx].t='gate'; else if(B.tiles[y][midx].t==='mountain') B.tiles[y][midx].t='forest'; }
  }
  if(!walkableBetween(a,b,'inf',B)){
    for(var y2=0;y2<H;y2++) for(var x2=0;x2<W;x2++){ if(B.tiles[y2][x2].t==='water'||B.tiles[y2][x2].t==='wall') { B.tiles[y2][x2].t='plain'; } }
  }
}
function walkableBetween(a,b,type,B){
  var seen={}, q=[a.x+','+a.y]; seen[a.x+','+a.y]=1;
  while(q.length){
    var k=q.shift(); if(k===b.x+','+b.y) return true;
    var p=k.split(','), x=+p[0], y=+p[1];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx=x+d[0], ny=y+d[1];
      if(nx<0||ny<0||nx>=B.cols||ny>=B.rows) return;
      var t=B.tiles[ny][nx].t, nk=nx+','+ny;
      if(seen[nk]) return;
      if(!isFinite(TERRAIN[t].cost)) return;
      if(t==='mountain'&&TYPES[type].noMountain) return;
      seen[nk]=1; q.push(nk);
    });
  }
  return false;
}

/* ---------- 兵力配置 ---------- */
function battleUnitCount(commit){ return clamp(3+Math.floor(commit/12),3,10); }
function armyCompTotal(comp){
  if(!comp) return 0;
  return TKEYS.reduce(function(sum,k){ return sum+Math.max(0,Math.floor(+comp[k]||0)); },0);
}
function defaultArmyComp(from,to,count){
  var types=autoMix({from:from,to:to},'p'), comp={inf:0,arc:0,cav:0,spc:0};
  for(var i=0;i<count;i++) comp[types[i%types.length]]++;
  return comp;
}
function resizeArmyComp(comp,from,to,count){
  var out={inf:0,arc:0,cav:0,spc:0};
  TKEYS.forEach(function(k){ out[k]=Math.max(0,Math.floor(+((comp||{})[k])||0)); });
  var total=armyCompTotal(out), types=autoMix({from:from,to:to},'p');
  while(total>count){
    for(var i=TKEYS.length-1;i>=0&&total>count;i--){
      if(out[TKEYS[i]]>0){ out[TKEYS[i]]--; total--; }
    }
  }
  while(total<count){ out[types[total%types.length]]++; total++; }
  return out;
}
function deployInitial(B,side,composition){
  var count=B.cap[side], comp=resizeArmyComp(composition||defaultArmyComp(B.from,B.to,count),B.from,B.to,count);
  for(var i=0;i<TKEYS.length;i++){
    var type=TKEYS[i];
    for(var n=0;n<comp[type];n++){
      var spots=deploymentSpots(B,side);
      if(!spots.length) return;
      var mine=bUnits(B,side), bestSpot=spots[0], bestScore=-1;
      for(var j=0;j<spots.length;j++){
        var spot=spots[j], dmin=99;
        for(var m=0;m<mine.length;m++) dmin=Math.min(dmin,Math.abs(mine[m].x-spot.x)+Math.abs(mine[m].y-spot.y));
        var score=dmin*1.6+ri(3)+(B.tiles[spot.y][spot.x].t==='village'?1.5:0);
        if(score>bestScore){ bestScore=score; bestSpot=spot; }
      }
      addUnit(B,side,type,bestSpot.x,bestSpot.y);
    }
  }
}
function autoMix(B,side){
  var lk=(linkInfo(B.from,B.to)||{t:'plain'}).t;
  if(lk==='mountain'||lk==='hill') return ['spc','inf','arc'];
  if(lk==='river') return ['inf','arc','arc'];
  return ['inf','cav','arc'];
}
function addUnit(B,side,type,x,y){
  var T=TYPES[type], q=B.qmul[side];
  var u={id:B.uid++,side:side,type:type,x:x,y:y,
    hp:Math.round(T.hp*q),max:Math.round(T.hp*q),
    atkMul:q,acted:true,moved:false,buff:0};
  B.units.push(u);
  return u;
}

/* ---------- 基本クエリ ---------- */
function bUnitAt(B,x,y){ for(var i=0;i<B.units.length;i++){ var u=B.units[i]; if(u.x===x&&u.y===y) return u; } return null; }
function bTile(B,x,y){ return B.tiles[y][x]; }
function bUnits(B,side){ return B.units.filter(function(u){ return u.side===side; }); }
function enemyOf(side){ return side==='p'?'e':'p'; }
function bStateOf(B,side){ return side==='p'?B.pState:B.eState; }
function blog(B,k,p){ if(!B) return; B.log.unshift({k:k,p:p||null}); if(B.log.length>18) B.log.length=18; }
function bfx(x,y,text){ if(typeof document==='undefined') return; var el=document.querySelector('.cell[data-x="'+x+'"][data-y="'+y+'"]'); if(!el) return; var d=document.createElement('div'); d.className='fx'; d.textContent=text; el.appendChild(d); setTimeout(function(){ try{ if(d.parentNode) d.parentNode.removeChild(d); }catch(e){} },700); }

function bPassable(B,u,x,y){
  if(x<0||y<0||x>=B.cols||y>=B.rows) return false;
  var t=bTile(B,x,y);
  if(!isFinite(TERRAIN[t.t].cost)) return false;
  if(t.t==='mountain'&&TYPES[u.type].noMountain) return false;
  if(t.t==='base'&&t.owner!==u.side) return false;
  if(bUnitAt(B,x,y)) return false;
  return true;
}
function bReach(B,u){
  var T=TYPES[u.type], best={}, lim=T.move+(u.buff>0?2:0);
  best[u.x+','+u.y]=0;
  var open=[{d:0,x:u.x,y:u.y}];
  var guard=0;
  while(open.length&&guard++<4000){
    open.sort(function(a,b){ return a.d-b.d; });
    var cur=open.shift(), key=cur.x+','+cur.y;
    if(best[key]<cur.d) continue;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){
      var nx=cur.x+dirs[i][0], ny=cur.y+dirs[i][1];
      if(!bPassable(B,u,nx,ny)) continue;
      var nd=cur.d+TERRAIN[bTile(B,nx,ny).t].cost;
      if(nd>lim) continue;
      var nk=nx+','+ny;
      if(best[nk]===undefined||nd<best[nk]){ best[nk]=nd; open.push({d:nd,x:nx,y:ny}); }
    }
  }
  return best;
}
function bTargets(B,u,x,y){
  var T=TYPES[u.type], out=[],i;
  for(i=0;i<B.units.length;i++){
    var o=B.units[i];
    if(o.side===u.side) continue;
    if(Math.abs(o.x-x)+Math.abs(o.y-y)<=T.range) out.push({kind:'unit',u:o});
  }
  var foe=enemyOf(u.side), b=B.basePos[foe];
  if(b&&B.baseHp[foe]>0&&Math.abs(b.x-x)+Math.abs(b.y-y)<=T.range) out.push({kind:'base',side:foe,x:b.x,y:b.y});
  return out;
}
function defOf(B,x,y){
  var t=bTile(B,x,y).t, d=TERRAIN[t].def;
  if(bTile(B,x,y).walled) d+=2;
  return d;
}
function bSiegeMul(B){ return 1+Math.floor(Math.max(0,B.turn-1)/8); }
function bRampMul(B){ if(B.turn<RAMP_FROM) return 1; return Math.min(RAMP_MAX,1+RAMP_STEP*(B.turn-RAMP_FROM)); }
function dmgOf(B,att,target,counter){
  var A=TYPES[att.type], ratio=att.hp/A.hp, mult=1, def=0;
  if(target.kind==='unit'){ mult=CNT[att.type][target.u.type]||1; def=defOf(B,target.u.x,target.u.y)*0.7; }
  else { mult=B.siege?1.3:1.15; def=TERRAIN.base.def*0.7; }
  var d=A.atk*att.atkMul*mult*(0.45+0.55*ratio)-def;
  if(!counter&&att.moved&&target.kind==='unit') d*=1.2;   // 踏み込み（電）のボーナス
  if(target.kind==='base') d*=bSiegeMul(B);
  else d*=bRampMul(B);
  if(att.buff>0) d*=1.5;
  if(counter) d*=1.0;
  return Math.max(1,d);
}
function rollDmg(B,att,target,counter){ return Math.max(1,Math.round(dmgOf(B,att,target,counter)*rnd(0.9,1.12))); }

/* ---------- 徴兵拠点 ---------- */
function deploymentSpots(B,side){
  var out=[],seen={},b=B.basePos[side];
  function ok(x,y){
    if(x<0||y<0||x>=B.cols||y>=B.rows) return false;
    var t=bTile(B,x,y);
    if(!isFinite(TERRAIN[t.t].cost)) return false;
    if(t.t==='base'&&t.owner!==side) return false;
    if(t.t==='mountain') return false;
    if(bUnitAt(B,x,y)) return false;
    return true;
  }
  function add(x,y){ if(!ok(x,y)) return; var k=x+','+y; if(seen[k]) return; seen[k]=1; out.push({x:x,y:y}); }
  if(b){
    for(var dy=-2;dy<=2;dy++) for(var dx=-2;dx<=2;dx++){
      if(Math.abs(dx)+Math.abs(dy)<=2) add(b.x+dx,b.y+dy);
    }
  }
  for(var y=0;y<B.rows;y++) for(var x=0;x<B.cols;x++){ var t=B.tiles[y][x]; if(t.t==='village'&&t.owner===side) add(x,y); }
  return out;
}

/* ---------- 移動・攻撃 ---------- */
function bMove(B,u,x,y){
  if(u.x!==x||u.y!==y){ u.x=x; u.y=y; }
  u.moved=true;
  var t=bTile(B,x,y);
  if(t.t==='village'&&t.owner!==u.side){ t.owner=u.side; blog(B,'b_village',{s:u.side}); }
}
function bKill(B,u){
  var i=B.units.indexOf(u); if(i>=0) B.units.splice(i,1);
  if(B.sel===u.id) B.sel=null;
  B.losses[u.side]+=4;
  B.morale[u.side]=Math.max(0,B.morale[u.side]-8);
  B.tac[enemyOf(u.side)]=Math.min(3,B.tac[enemyOf(u.side)]+1);
  blog(B,'b_kill',{s:u.side,u:u.type});
}
function bAttack(B,u,target){
  u.acted=true;
  if(u.side===B.meSide) sfx('atk');
  if(target.kind==='unit'){
    var d=target.u, dmg=rollDmg(B,u,target,false);
    d.hp-=dmg; bfx(d.x,d.y,'-'+dmg);
    blog(B,'b_hit',{a:u.side,au:u.type,d:d.side,du:d.type,v:dmg});
    if(d.hp<=0){ if(u.side===B.meSide) sfx('kill'); bKill(B,d); }
    else{
      var dist=Math.abs(u.x-d.x)+Math.abs(u.y-d.y);
      if(TYPES[d.type].range===1&&dist<=1&&u.hp>0&&u.buff<2){
        var c=Math.round(rollDmg(B,d,{kind:'unit',u:u},true)*0.6);
        u.hp-=c; bfx(u.x,u.y,'-'+c);
        blog(B,'b_counter',{v:c});
        if(u.hp<=0) bKill(B,u);
      }
    }
  }else{
    var dmg2=rollDmg(B,u,target,false);
    B.baseHp[target.side]-=dmg2; bfx(target.x,target.y,'-'+dmg2);
    B.morale[target.side]=Math.max(0,B.morale[target.side]-Math.round(dmg2/2.8));
    blog(B,'b_basehit',{s:u.side,u:u.type,foe:target.side,v:dmg2,left:Math.max(0,B.baseHp[target.side])});
    if(u.side===B.meSide) sfx('base');
  }
  bCheckEnd(B);
}
/* ---------- 手番・士気・軍略 ---------- */
function noForces(B,s){ return bUnits(B,s).length===0; }
function bCheckEnd(B){
  if(B.over) return B.over;
  if(B.baseHp.e<=0) B.over={winner:'att',reason:'camp'};
  else if(B.baseHp.p<=0) B.over={winner:'def',reason:'camp'};
  else if(B.morale.e<=0) B.over={winner:'att',reason:'rout'};
  else if(B.morale.p<=0) B.over={winner:'def',reason:'rout'};
  else if(noForces(B,'e')) B.over={winner:'att',reason:'elim'};
  else if(noForces(B,'p')) B.over={winner:'def',reason:'elim'};
  else if(B.turn>B.maxTurn) B.over={winner:'def',reason:'stale'};
  if(B.over) blog(B,'b_end',{w:B.over.winner,r:B.over.reason});
  return B.over;
}
function bRoundEnd(B){
  B.turn++;
  ['p','e'].forEach(function(s){
    B.tac[s]=Math.min(3,B.tac[s]+1);
    if(B.baseHp[s]>0) B.morale[s]=Math.min(100,B.morale[s]+2);
  });
  if(B.turn>=10) B.morale.p=Math.max(0,B.morale.p-2);      // 城外の攻め手は補給が細る
  B.units.forEach(function(u){
    var t=bTile(B,u.x,u.y);
    if((t.t==='base'||t.t==='village')&&t.owner===u.side) u.hp=Math.min(u.max,u.hp+3);
    u.acted=false; u.moved=false; u.buff=0;
  });
  B.undo=[];
  bCheckEnd(B);
}
/* ---------- 戦法（将軍の特殊能力：軍略ゲージを消費） ---------- */
function skillOf(B,side){
  var gk=B.gen[side]; if(!gk) return null;
  var g=genData(gk); if(!g||!SKILLS[g.skill]) return null;
  return {key:g.skill,def:SKILLS[g.skill],gen:g};
}
function skillReady(B,side){
  var s=skillOf(B,side);
  return !!(s&&!B.over&&B.tac[side]>=s.def.cost);
}
function useSkill(B,side,tx,ty){
  var sk=skillOf(B,side);
  if(!sk||B.tac[side]<sk.def.cost||B.over) return false;
  var g=sk.gen, foe=enemyOf(side), applied=false;
  if(sk.key==='fire'){
    var hit=0;
    for(var y=Math.max(0,ty-1);y<=Math.min(B.rows-1,ty+1);y++)
      for(var x=Math.max(0,tx-1);x<=Math.min(B.cols-1,tx+1);x++){
        if(B.tiles[y][x].t==='forest'){ B.tiles[y][x].t='plain'; B.tiles[y][x].owner=null; }
        var u=bUnitAt(B,x,y);
        if(u&&u.side===foe){ var d=Math.round((5+g.int)*B.qmul[side]*rnd(0.9,1.15)); u.hp-=d; bfx(x,y,'-'+d); hit++; if(u.hp<=0) bKill(B,u); }
      }
    if(hit){ B.morale[foe]=Math.max(0,B.morale[foe]-4); sfx('fire'); blog(B,'b_skill',{s:side,k:'fire',n:hit}); applied=true; }
  }else if(sk.key==='charge'){
    var target=bUnitAt(B,tx,ty);
    if(target&&target.side===side){
      target.buff=1; target.acted=false; target.moved=false;
      sfx('skill'); blog(B,'b_skill',{s:side,k:'charge',n:1}); applied=true;
    }
  }else if(sk.key==='rally'){
    var b=B.basePos[side], healed=0, heal=5+Math.round(g.int/2);
    B.units.forEach(function(u){
      if(u.side!==side||!b) return;
      if(Math.abs(u.x-b.x)+Math.abs(u.y-b.y)>2) return;
      u.hp=Math.min(u.max,u.hp+heal); healed++; bfx(u.x,u.y,'+'+heal);
    });
    B.morale[side]=Math.min(100,B.morale[side]+10);
    sfx('skill'); blog(B,'b_skill',{s:side,k:'rally',n:healed}); applied=true;
  }else if(sk.key==='surprise'){
    var bb=B.basePos[side], hit=0;
    B.units.slice().forEach(function(u){
      if(u.side===foe&&bb&&Math.abs(u.x-bb.x)+Math.abs(u.y-bb.y)<=3){
        u.hp-=4; hit++; bfx(u.x,u.y,'-4'); if(u.hp<=0) bKill(B,u);
      }
    });
    B.morale[foe]=Math.max(0,B.morale[foe]-6);
    sfx('skill'); blog(B,'b_skill',{s:side,k:'surprise',n:hit}); applied=true;
  }
  if(!applied) return false;
  B.tac[side]-=sk.def.cost;
  bCheckEnd(B);
  return true;
}

/* ---------- 戦闘 AI（両軍ともこの手順で動く） ---------- */
function costMap(B,type,targets){
  var dist={}, q=[];
  (targets||[]).forEach(function(t){ if(!t) return; dist[t.x+','+t.y]=0; q.push({d:0,x:t.x,y:t.y}); });
  var guard=0;
  while(q.length&&guard++<5000){
    q.sort(function(a,b){ return a.d-b.d; });
    var c=q.shift(), k=c.x+','+c.y;
    if(dist[k]<c.d) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx=c.x+d[0], ny=c.y+d[1];
      if(nx<0||ny<0||nx>=B.cols||ny>=B.rows) return;
      var t=B.tiles[ny][nx].t;
      if(!isFinite(TERRAIN[t].cost)) return;
      if(t==='mountain'&&TYPES[type].noMountain) return;
      var nd=c.d+TERRAIN[t].cost, nk=nx+','+ny;
      if(dist[nk]===undefined||nd<dist[nk]){ dist[nk]=nd; q.push({d:nd,x:nx,y:ny}); }
    });
  }
  return dist;
}
function threatAt(B,x,y,side){
  var sum=0, foes=bUnits(B,enemyOf(side));
  foes.forEach(function(o){
    var T=TYPES[o.type], dist=Math.abs(o.x-x)+Math.abs(o.y-y);
    if(dist<=T.move+T.range) sum+=T.atk*B.qmul[o.side]*(o.hp/o.max)*0.6;
  });
  return sum;
}
function aiSide(B,side){
  if(B.over) return;
  aiUseSkill(B,side);
  var list=bUnits(B,side).slice().sort(function(a,b){ return TYPES[b.type].atk-TYPES[a.type].atk; });
  list.forEach(function(u){
    if(B.over) return;
    if(u.side!==side||u.acted) return;
    if(B.units.indexOf(u)<0) return;
    aiActUnit(B,u);
  });
}
function aiUseSkill(B,side){
  if(!skillReady(B,side)) return;
  var sk=skillOf(B,side);
  if(sk.key==='fire'){
    var best=null;
    for(var y=0;y<B.rows;y++) for(var x=0;x<B.cols;x++){
      var n=0;
      for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
        var u=bUnitAt(B,x+dx,y+dy); if(u&&u.side!==side) n++;
      }
      if(n>=2&&(!best||n>best.n)) best={n:n,x:x,y:y};
    }
    if(best){ useSkill(B,side,best.x,best.y); return; }
  }else if(sk.key==='charge'){
    var mine=bUnits(B,side), foe=bUnits(B,enemyOf(side)), pickU=null, bd=99;
    mine.forEach(function(u){
      if(u.acted) return;
      foe.forEach(function(o){ var d=Math.abs(u.x-o.x)+Math.abs(u.y-o.y); if(d<bd){ bd=d; pickU=u; } });
    });
    if(pickU&&bd<=4){ useSkill(B,side,pickU.x,pickU.y); return; }
  }else if(sk.key==='rally'){
    var tot=0, hp=0;
    bUnits(B,side).forEach(function(u){ tot++; hp+=u.hp/u.max; });
    if(tot&&B.morale[side]<58&&hp/tot<0.68){ useSkill(B,side,0,0); return; }
  }else if(sk.key==='surprise'){
    if(B.tac[side]>=3){ useSkill(B,side,0,0); return; }
  }
}
function aiActUnit(B,u){
  var reach=bReach(B,u), roleAtk=(u.side==='p');
  var objTiles=roleAtk?[B.basePos.e]:bUnits(B,'p');
  var cmap=costMap(B,u.type,objTiles);
  var ownBase=B.basePos[u.side];
  var d0=(cmap[u.x+','+u.y]===undefined?40:cmap[u.x+','+u.y]);
  var best=null;
  for(var key in reach){
    var p=key.split(','), x=+p[0], y=+p[1];
    var d=(cmap[key]===undefined?40:cmap[key]);
    var sc=(d0-d)*(roleAtk?3.6:2.6);
    sc+=defOf(B,x,y)*1.6;
    sc-=threatAt(B,x,y,u.side)*0.7;
    if(B.tiles[y][x].t==='village'&&B.tiles[y][x].owner!==u.side) sc+=4.5;
    if(B.tiles[y][x].t==='gate'&&roleAtk) sc+=1.8;
    if(ownBase){ var db=Math.abs(x-ownBase.x)+Math.abs(y-ownBase.y); if(db>5) sc-=(db-5)*1.6; }
    var hit=bestAttackFrom(B,u,x,y);
    if(hit) sc+=hit.value;
    if(!best||sc>best.sc) best={sc:sc,x:x,y:y,hit:hit};
  }
  if(!best) return;
  if(best.x!==u.x||best.y!==u.y) bMove(B,u,best.x,best.y);
  var hit2=bestAttackFrom(B,u,u.x,u.y);
  if(hit2&&(!best.hit||hit2.value>=best.hit.value*0.6)) bAttack(B,u,hit2.target);
  else u.acted=true;
}
function bestAttackFrom(B,u,x,y){
  var list=bTargets(B,u,x,y), best=null;
  list.forEach(function(tg){
    var dmg=rollDmg(B,u,tg,false), val=dmg;
    if(tg.kind==='unit'){
      var d=tg.u;
      if(dmg>=d.hp) val+=11;
      var dist=Math.abs(u.x-d.x)+Math.abs(u.y-d.y);
      if(TYPES[d.type].range===1&&dist<=1&&u.buff<2) val-=rollDmg(B,d,{kind:'unit',u:u},true)*0.85;
      val+=defOf(B,x,y)*0.4;
    }else val+=8;                                   // 本営を叩く価値
    if(!best||val>best.value) best={value:val,target:tg,dmg:dmg};
  });
  return best;
}
function simBattle(B){
  var guard=0;
  while(!B.over&&guard++<B.maxTurn+2){
    aiSide(B,'p');
    if(B.over) break;
    aiSide(B,'e');
    if(B.over) break;
    bRoundEnd(B);
  }
  if(!B.over) B.over={winner:'def',reason:'stale'};
  return B.over;
}

/* ---------- 戦闘開始／終了 ---------- */
function startBattle(fromKey,toKey,commit,genKey,comp){
  BT=makeBattle(fromKey,toKey,commit,genKey,false,comp);
  S.battle={from:fromKey,to:toKey,commit:commit,gen:genKey||null};
  S.battleData=BT;
  S.ui.mode=null;
  showScreen('scrBattle');
  buildBoard();
  renderBattle();
  saveGame(true);
}
function pushUndoB(){
  if(!BT) return;
  BT.undo.push(JSON.stringify({units:BT.units,tiles:BT.tiles,baseHp:BT.baseHp,morale:BT.morale,tac:BT.tac,losses:BT.losses}));
  if(BT.undo.length>10) BT.undo.shift();
}
function undoBattle(){
  if(!BT||!BT.undo||!BT.undo.length) return;
  try{
    var o=JSON.parse(BT.undo.pop());
    BT.units=o.units; BT.tiles=o.tiles; BT.baseHp=o.baseHp; BT.morale=o.morale; BT.tac=o.tac; BT.losses=o.losses;
    BT.sel=null; BT.skill=null;
    sfx('unsel'); blog(BT,'b_undo',null);
    renderBattle();
  }catch(e){}
}
function playerEndTurn(){
  if(!BT||BT.over) return;
  pushUndoB();
  BT.sel=null; BT.skill=null;
  sfx('turnE');
  aiSide(BT,enemyOf(BT.meSide));
  if(!BT.over){ bRoundEnd(BT); sfx('turn'); }
  renderBattle();
  if(BT.over) finishBattleUI();
  else saveGame(true);
}
function retreatBattle(){
  if(!BT||BT.over) return;
  BT.over={winner:(BT.meSide==='p')?'def':'att',reason:'retreat'};
  blog(BT,'b_retreat',null);
  renderBattle();
  finishBattleUI();
}
function battleWonByMe(B){
  if(!B.over) return false;
  var winSide=(B.over.winner==='att')?'p':'e';
  return winSide===B.meSide;
}
function finishBattleUI(){
  if(!BT||!BT.over||BT.resolved) return;
  BT.resolved=true;
  var applied=applyBattleResult(BT);
  S.lastBattle={city:BT.city,win:battleWonByMe(BT),reason:BT.over.reason,attWin:applied.attWin,
    myLoss:(BT.meSide==='p'?applied.attLoss:applied.defLoss),
    foeLoss:(BT.meSide==='p'?applied.defLoss:applied.attLoss),
    att:BT.att,def:BT.def,turn:BT.turn,meAtk:BT.attIsMe};
  S.battle=null; S.battleData=null; BT=null;
  if(S.lastBattle.win) sfx('win'); else sfx('lose');

}

/* ---------- 大地のピクセル絵 ---------- */
var T_PLAIN=0,T_GRASS=1,T_FOREST=2,T_HILL=3,T_MOUNT=4,T_RIVER=5,T_SEA=6,T_MARSH=7,T_DUNE=8,T_PADDY=9;
var WORLD=null, WORLD_ART=null, MAP_SCALE=1, CITY_PX={};
var RANGES=[
  [3,13,5,12],[7,13,8,14],[17,6,17,11],[13,4,16,5],[27,2,31,3],
  [17,13,18,14],[12,13,13,13],[13,14,15,14],[15,17,17,18],[20,15,22,16],
  [32,12,33,12],[33,21,36,22],[5,10,6,10],[24,6,25,7]
];
var RIVERS=[
  [[1,13],[5,12],[8,11],[12,9],[16,8],[20,7],[24,7],[28,8],[32,9],[36,9],[40,9]],
  [[2,21],[7,21],[12,21],[16,20],[20,20],[25,19],[29,19],[34,19],[39,18]],
  [[26,14],[29,15],[32,16],[35,17]]
];
var LAKE=[[14,20,17,21]];
function buildWorld(){
  var g=[],x,y,row;
  for(y=0;y<MAP_H;y++){ row=[]; for(x=0;x<MAP_W;x++) row.push(T_PLAIN); g.push(row); }
  function coast(x,y){
    if(y<3) return x>=40;
    if(y>=3&&y<=7) return x>=35;
    return x>=41;
  }
  for(y=0;y<MAP_H;y++) for(x=0;x<MAP_W;x++) if(coast(x,y)) g[y][x]=T_SEA;
  for(y=3;y<=8;y++) for(x=0;x<=4;x++) g[y][x]=T_DUNE;
  function line(x0,y0,x1,y1,t,wide){
    var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)),i;
    for(i=0;i<=n;i++){
      var px=Math.round(x0+(x1-x0)*i/n), py=Math.round(y0+(y1-y0)*i/n);
      if(px<0||py<0||px>=MAP_W||py>=MAP_H) continue;
      if(g[py][px]===T_SEA) continue;
      g[py][px]=t;
      if(wide&&px+1<MAP_W&&g[py][px+1]!==T_SEA) g[py][px+1]=t;
    }
  }
  RANGES.forEach(function(r){ line(r[0],r[1],r[2],r[3],T_MOUNT); });
  [[9,6,11,6],[2,16,4,16],[38,12,39,13]].forEach(function(r){ line(r[0],r[1],r[2],r[3],T_HILL); });
  RIVERS.forEach(function(pts){ for(var i=0;i<pts.length-1;i++) line(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],T_RIVER); });
  LAKE.forEach(function(l){ for(var yy=l[1];yy<=l[3];yy++) for(var xx=l[0];xx<=l[2];xx++) if(g[yy]&&g[yy][xx]!==undefined&&g[yy][xx]!==T_SEA) g[yy][xx]=T_RIVER; });
  var R=seedRnd(20260606);
  for(var i=0;i<26;i++){
    var fx=Math.floor(R()*MAP_W), fy=8+Math.floor(R()*(MAP_H-9));
    var rad=1+Math.floor(R()*2);
    for(var dy=-rad;dy<=rad;dy++) for(var dx=-rad;dx<=rad;dx++){
      var px=fx+dx, py=fy+dy;
      if(px<0||py<0||px>=MAP_W||py>=MAP_H) continue;
      if(g[py][px]===T_PLAIN&&R()<0.75) g[py][px]=T_FOREST;
    }
  }
  for(y=0;y<MAP_H;y++) for(x=0;x<MAP_W;x++){
    if(g[y][x]===T_PLAIN&&R()<0.10) g[y][x]=T_GRASS;
    if(g[y][x]===T_RIVER&&y>0&&g[y-1][x]!==T_RIVER&&R()<0.35) g[y][x]=T_MARSH;
  }
  CITIES.forEach(function(c){
    for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
      var px=c.x+dx, py=c.y+dy;
      if(px<0||py<0||px>=MAP_W||py>=MAP_H) continue;
      if(g[py][px]===T_PLAIN||g[py][px]===T_GRASS) if(R()<0.6) g[py][px]=T_PADDY;
    }
  });
  WORLD=g;
}
function paintWorld(){
  if(WORLD_ART) return WORLD_ART;
  var cv=document.createElement('canvas');
  cv.width=MAP_W*TILE; cv.height=MAP_H*TILE;
  var g=cv.getContext('2d'); if(!g){ WORLD_ART=cv; return cv; }
  var R=seedRnd(777);
  var PAL={};
  PAL[T_PLAIN]=['#4e6039','#57693f','#455633'];
  PAL[T_GRASS]=['#5c6b3c','#66764a','#51603a'];
  PAL[T_PADDY]=['#6a7440','#7c854c','#5b6739'];
  PAL[T_FOREST]=['#2e4630','#3a5738','#243b2a'];
  PAL[T_HILL]=['#6b6b45','#7a7a52','#585a3b'];
  PAL[T_MOUNT]=['#5d5a51','#6f6c60','#48463e'];
  PAL[T_RIVER]=['#2d5c78','#3b718f','#24506b'];
  PAL[T_MARSH]=['#3f5c47','#4c6b52','#35503d'];
  PAL[T_DUNE] =['#8a7a55','#98876a','#75664a'];
  PAL[T_SEA]  =['#1d3f5c','#265074','#173351'];
  function px(x,y,c){ g.fillStyle=c; g.fillRect(x,y,1,1); }
  for(var ty=0;ty<MAP_H;ty++) for(var tx=0;tx<MAP_W;tx++){
    var t=WORLD[ty][tx], p=PAL[t]||PAL[T_PLAIN];
    var ox=tx*TILE, oy=ty*TILE, i, xx, yy;
    g.fillStyle=p[0]; g.fillRect(ox,oy,TILE,TILE);
    for(i=0;i<10;i++){
      xx=ox+Math.floor(R()*TILE); yy=oy+Math.floor(R()*TILE);
      px(xx,yy,R()<0.5?p[1]:p[2]);
    }
    if(t===T_MOUNT){
      g.fillStyle='#7e7a6c'; g.beginPath(); g.moveTo(ox+2,oy+13); g.lineTo(ox+8,oy+3); g.lineTo(ox+14,oy+13); g.closePath(); g.fill();
      g.fillStyle='#a8a496'; g.fillRect(ox+7,oy+4,3,2);
      g.fillStyle='#4b4941'; g.fillRect(ox+9,oy+7,3,6);
    }else if(t===T_HILL){
      g.fillStyle='#7f7f55'; g.beginPath(); g.moveTo(ox+3,oy+12); g.lineTo(ox+8,oy+6); g.lineTo(ox+13,oy+12); g.closePath(); g.fill();
    }else if(t===T_FOREST){
      [[4,9],[8,7],[11,10]].forEach(function(tr){
        g.fillStyle='#31402c'; g.fillRect(ox+tr[0],oy+tr[1]-1,1,3);
        g.fillStyle='#4a6b3d'; g.fillRect(ox+tr[0]-2,oy+tr[1]-3,5,3);
        g.fillStyle='#5c7f47'; g.fillRect(ox+tr[0]-1,oy+tr[1]-4,3,2);
      });
    }else if(t===T_RIVER||t===T_SEA){
      g.fillStyle=(t===T_SEA)?'#3f6f96':'#5288a8';
      for(i=0;i<3;i++) g.fillRect(ox+2+Math.floor(R()*10),oy+2+Math.floor(R()*12),2,1);
      if(t===T_SEA){ g.fillStyle='#15304a'; g.fillRect(ox,oy+TILE-1,TILE,1); }
    }else if(t===T_PADDY){
      g.strokeStyle='rgba(30,45,25,.45)'; g.lineWidth=1;
      for(i=0;i<3;i++){ g.beginPath(); g.moveTo(ox+2,oy+3+i*4); g.lineTo(ox+13,oy+3+i*4); g.stroke(); }
    }else if(t===T_MARSH){
      g.fillStyle='#4a6b52'; for(i=0;i<5;i++) g.fillRect(ox+2+Math.floor(R()*12),oy+2+Math.floor(R()*12),1,2);
    }
  }
  WORLD_ART=cv;
  return cv;
}
var mapCtx=null, mapCanvas=null;
function renderMap(){
  if(!S) return;
  if(!WORLD) buildWorld();
  if(!mapCanvas){ mapCanvas=document.getElementById('mapc'); if(!mapCanvas) return; mapCtx=mapCanvas.getContext('2d'); }
  var Wpx=MAP_W*TILE, Hpx=MAP_H*TILE;
  if(mapCanvas.width!==Wpx){ mapCanvas.width=Wpx; mapCanvas.height=Hpx; }
  var g=mapCtx; if(!g) return;
  g.clearRect(0,0,Wpx,Hpx);
  g.drawImage(paintWorld(),0,0);
  // 街道
  g.strokeStyle='rgba(18,24,20,.72)'; g.lineWidth=4; g.setLineDash([]);
  LINKS.forEach(function(L){
    var a=findCity(L[0]), b=findCity(L[1]);
    g.beginPath(); g.moveTo(a.x*TILE+8,a.y*TILE+8); g.lineTo(b.x*TILE+8,b.y*TILE+8); g.stroke();
  });
  g.strokeStyle='rgba(187,151,87,.9)'; g.lineWidth=2; g.setLineDash([4,3]);
  LINKS.forEach(function(L){
    var a=findCity(L[0]), b=findCity(L[1]);
    g.beginPath(); g.moveTo(a.x*TILE+8,a.y*TILE+8); g.lineTo(b.x*TILE+8,b.y*TILE+8); g.stroke();
  });
  g.setLineDash([]);
  // 長城（北方の防塞）
  g.strokeStyle='rgba(190,180,150,.55)'; g.lineWidth=1; g.setLineDash([2,2]);
  g.beginPath(); g.moveTo(20*TILE,5*TILE); g.lineTo(26*TILE,4*TILE); g.lineTo(29*TILE,5*TILE); g.stroke();
  g.setLineDash([]);
  // 都市
  CITY_PX={};
  CITIES.forEach(function(c){
    var d=S.cities[c.k], stt=findState(d.owner), col=stt?stt.col:'#8a8a8a';
    var cx=c.x*TILE, cy=c.y*TILE;
    CITY_PX[c.k]={x:cx,y:cy};
    drawCity(g,cx,cy,c,d,col);
  });
  // 選択・行動可能な都市の強調
  var sel=S.ui.sel;
  if(sel){
    var d0=S.cities[sel], c0=findCity(sel);
    g.strokeStyle=(d0.owner===S.me)?'#f5e2a8':'#e08a7c'; g.lineWidth=2;
    g.strokeRect(c0.x*TILE-1,c0.y*TILE-1,TILE+2,TILE+2);
  }
  if(S.ui.mode){
    legalTargets().forEach(function(tk){
      var c=findCity(tk);
      var mark=(S.ui.mode.kind==='attack')?'#ef7b6a':'#7fe0a0';
      g.fillStyle=mark; g.fillRect(c.x*TILE+6,c.y*TILE-4,4,3);
      g.strokeStyle=mark; g.lineWidth=1; g.strokeRect(c.x*TILE,c.y*TILE,TILE,TILE);
    });
  }
}
function drawCity(g,cx,cy,c,d,col){
  var cap=(findState(d.owner)&&findState(d.owner).cap===c.k);
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(cx+2,cy+12,12,2);
  // 城壁
  g.fillStyle='#6d6455'; g.fillRect(cx+2,cy+5,12,8);
  g.fillStyle='#8f8672'; g.fillRect(cx+2,cy+5,12,2);
  g.fillStyle='#4c4638'; g.fillRect(cx+2,cy+9,12,1);
  for(var i=0;i<4;i++) g.fillRect(cx+2+i*3,cy+3,2,2);             // 女牆
  if(cap){ g.fillStyle='#6d6455'; g.fillRect(cx+4,cy+1,8,4); g.fillStyle='#8f8672'; g.fillRect(cx+4,cy+1,8,1); }
  // 屋根
  g.fillStyle=col; g.fillRect(cx+4,cy+(cap?3:6),8,3);
  g.fillStyle=mix(col,-0.35); g.fillRect(cx+5,cy+(cap?4:7),6,1);
  // 旗
  g.fillStyle='#2b2b2b'; g.fillRect(cx+11,cy-2,1,6);
  g.fillStyle=col; g.fillRect(cx+12,cy-2,3,3);
  g.fillStyle=mix(col,0.3); g.fillRect(cx+12,cy-2,1,1);
  // 守備兵のピクセル（1ドット=2兵）
  var dots=Math.min(6,Math.ceil(d.garr/5));
  for(var k=0;k<dots;k++){ g.fillStyle='#1a1f27'; g.fillRect(cx+2+k*2,cy+13,2,2); g.fillStyle='#e6e0cf'; g.fillRect(cx+2+k*2,cy+13,1,1); }
  // 動揺
  if(d.unrest>25){ g.fillStyle='#e0685c'; g.fillRect(cx+13,cy+10,2,2); }
  // 兵力数（小さな数字）
  if(d.garr>0){
    g.fillStyle='rgba(6,9,13,.8)'; g.fillRect(cx-1,cy+14,10,6);
    g.fillStyle='#f0e6c8'; g.font='bold 7px monospace'; g.textBaseline='top';
    g.fillText(String(d.garr),cx,cy+14);
  }
}
function fitMap(){
  var wrap=document.getElementById('mapWrap'), cv=document.getElementById('mapc');
  if(!wrap||!cv) return;
  var aw=wrap.clientWidth-8, ah=wrap.clientHeight-8;
  if(aw<=0||ah<=0){ return; }
  var s=Math.min(aw/(MAP_W*TILE),ah/(MAP_H*TILE));
  MAP_SCALE=Math.max(0.4,s);
  cv.style.width=Math.floor(MAP_W*TILE*MAP_SCALE)+'px';
  cv.style.height=Math.floor(MAP_H*TILE*MAP_SCALE)+'px';
}
function mapPick(ev){
  var cv=document.getElementById('mapc'); if(!cv||!S) return null;
  var r=cv.getBoundingClientRect();
  var sx=(ev.touches&&ev.touches[0])?ev.touches[0].clientX:ev.clientX;
  var sy=(ev.touches&&ev.touches[0])?ev.touches[0].clientY:ev.clientY;
  var x=Math.floor((sx-r.left)/MAP_SCALE/TILE), y=Math.floor((sy-r.top)/MAP_SCALE/TILE);
  var best=null,bd=1e9;
  CITIES.forEach(function(c){
    var dd=(c.x-x)*(c.x-x)+(c.y-y)*(c.y-y);
    if(dd<bd){ bd=dd; best=c.k; }
  });
  return (bd<=4.2)?best:null;
}
function onMapTap(ev){
  if(!S||S.over) return;
  var k=mapPick(ev);
  if(!k){ S.ui.mode=null; renderMap(); return; }
  var m=S.ui.mode;
  if(m&&m.from&&has(legalTargets(),k)){
    if(m.kind==='move') moveArmy(m.from,k,true);
    else if(m.kind==='split') moveArmy(m.from,k,false);
    S.ui.mode=null; S.ui.sel=k; renderCamp(); return;
  }
  S.ui.sel=k; S.ui.mode=null;
  renderCamp();
}
function onMapHover(ev){
  var tip=document.getElementById('mapTip');
  if(!tip||!S) return;
  var k=mapPick(ev);
  if(!k){ tip.style.display='none'; return; }
  var d=S.cities[k], stt=findState(d.owner);
  tip.innerHTML='<b>'+cityName(k)+'</b> ／ <span style="color:'+(stt?stt.col:'#999')+'">'+stateName(d.owner)+'</span><br>'+
    t('k_garr')+': '+d.garr+' ・ '+t('k_walls')+': '+d.walls+'<br>'+
    t('k_farms')+': '+d.farms+' ・ '+t('k_town')+': '+d.town+' ・ '+t('k_train')+': '+d.train+
    (d.unrest>0?('<br>'+t('k_unrest')+': '+d.unrest):'');
  tip.style.display='block';
  var wrap=document.getElementById('mapWrap'), r=wrap.getBoundingClientRect();
  var px=(ev.clientX-r.left)+10, py=(ev.clientY-r.top)+10;
  tip.style.left=Math.min(px,r.width-240)+'px'; tip.style.top=Math.min(py,r.height-70)+'px';
}
function legalTargets(){
  var m=S.ui.mode; if(!m) return [];
  var out=[];
  neighbors(m.from).forEach(function(l){
    var d=S.cities[l.to];
    if(m.kind==='move'||m.kind==='split'){ if(d.owner===S.me) out.push(l.to); }
    else if(m.kind==='attack'){ if(d.owner!==S.me&&st(d.owner).alive) out.push(l.to); }
  });
  return out;
}

function renderPowers(){
  var box=document.getElementById('powerList'); if(!box) return;
  var h='';
  STATES.forEach(function(o){
    var k=o.k, s=st(k);
    if(!s.alive) return;
    var w=warOf(S.me,k), r=relOf(S.me,k);
    var cls=k===S.me?'you':(w&&w.s==='war'?'war':(w&&w.s==='ally'?'ally':'peace'));
    var label=k===S.me?t('p_you'):(w&&w.s==='war'?t('p_war'):(w&&w.s==='ally'?t('p_ally'):(w&&w.s==='truce'?t('p_truce'):t('p_peace'))));
    h+='<div class="wrow"><span class="dot" style="background:'+o.col+'"></span>'+
       '<span class="nm">'+stateName(k)+'</span>'+
       '<span class="st '+cls+'">'+label+'</span></div>'+
       '<div class="wrow" style="border:0;padding:0 0 3px 15px;font-size:10px;color:#8ea3b8">'+
       t('p_cities')+': '+citiesOf(k).length+' ・ '+t('p_garr')+': '+totalGarr(k)+
       ' ・ '+t('p_rel')+': '+r;
    if(k!==S.me){
      h+=' <button class="tiny" data-dip="envoy" data-s="'+k+'">'+t('d_envoy')+'</button>';
      if(atWar(S.me,k)) h+=' <button class="tiny" data-dip="peace" data-s="'+k+'">'+t('d_peace')+'</button>';
      else if(!allied(S.me,k)) h+=' <button class="tiny" data-dip="ally" data-s="'+k+'">'+t('d_ally')+'</button>';
      if(!atWar(S.me,k)&&w&&w.s!=='ally') h+=' <button class="tiny" data-dip="war" data-s="'+k+'">'+t('d_war')+'</button>';
    }
    h+='</div>';
  });
  box.innerHTML=h;
  var btns=box.querySelectorAll?box.querySelectorAll('button[data-dip]'):[];
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click',function(){
        var kk=b.getAttribute('data-s')||b.dataset.s, what=b.getAttribute('data-dip')||b.dataset.dip;
        if(what==='envoy') envoyAct(kk);
        else if(what==='peace') peaceAct(kk);
        else if(what==='ally') allianceAct(kk);
        else if(what==='war'){ declareWar(S.me,kk,false); renderCamp(); saveGame(true); }
      });
    })(btns[i]);
  }
}
function renderCityPanel(){
  var box=document.getElementById('cityInfo'), act=document.getElementById('cityAct'), ttl=document.getElementById('cityTitle');
  if(!box||!act) return;
  var k=S.ui.sel;

var CELLS={}, boardEl=null;
function unitById(id){ if(!BT) return null; for(var i=0;i<BT.units.length;i++) if(BT.units[i].id===id) return BT.units[i]; return null; }
function buildBoard(){
  boardEl=document.getElementById('board');
  if(!boardEl||!BT) return;
  boardEl.innerHTML=''; CELLS={};
  boardEl.style.gridTemplateColumns='repeat('+BT.cols+',var(--cell,34px))';
  var rot=(BT.meSide==='e');
  for(var dy=0;dy<BT.rows;dy++) for(var dx=0;dx<BT.cols;dx++){
    var x=rot?BT.cols-1-dx:dx, y=rot?BT.rows-1-dy:dy;

    el.className='cell t-plain';
    el.setAttribute('data-x',x); el.setAttribute('data-y',y);

function hlSets(){
  var mv={},hit={},sk={};
  if(!BT||BT.over) return {mv:mv,hit:hit,sk:sk};
  var u=BT.sel?unitById(BT.sel):null;
  if(u&&!u.acted&&u.side===BT.meSide){
    var reach=bReach(BT,u);
    for(var key in reach){
      var p=key.split(',');
      mv[p[0]+','+p[1]]=1;
      bTargets(BT,u,+p[0],+p[1]).forEach(function(tg){
        if(tg.kind==='unit') hit[tg.u.x+','+tg.u.y]=1; else hit[tg.x+','+tg.y]=1;
      });
    }
  }
  if(BT.skill) for(var y2=0;y2<BT.rows;y2++) for(var x2=0;x2<BT.cols;x2++) sk[x2+','+y2]=1;
  return {mv:mv,hit:hit,sk:sk};
}
function renderBattle(){
  if(!BT) return;
  if(!boardEl||!boardEl.childNodes.length) buildBoard();
  var H=hlSets();
  for(var y=0;y<BT.rows;y++) for(var x=0;x<BT.cols;x++){
    var el=CELLS[x+','+y]; if(!el) continue;
    var tile=BT.tiles[y][x], key=x+','+y;
    var cls='cell t-'+tile.t;
    if(tile.owner) cls+=' own-'+tile.owner;
    if(H.mv[key]) cls+=' hl-move';
    if(H.hit[key]) cls+=' hl-hit';
    if(H.sk[key]) cls+=' hl-skill';
    var inner='';

    if(gl) inner+='<span class="terr">'+gl+'</span>';

    if(u){
      inner+='<div class="chip'+(u.side===BT.meSide&&u.acted?' spent':'')+'">'+
        '<img class="spr" alt="" src="'+spriteUri(u.type,teamOf(BT,u.side))+'"></div>'+
        '<div class="hpb"><b class="'+(u.hp/u.max<0.4?'low':'')+'" style="width:'+Math.max(2,Math.round(u.hp/u.max*100))+'%"></b></div>';

function fit(){
  var wrap=document.getElementById('wrap'), board=document.getElementById('board');
  if(!wrap||!board||!BT) return;
  var availW=wrap.clientWidth-6, availH=wrap.clientHeight-6;
  if(availW<=0||availH<=0) return;
  var gap=2;
  var s=Math.floor(Math.min((availW-(BT.cols-1)*gap-10)/BT.cols,(availH-(BT.rows-1)*gap-10)/BT.rows));
  s=clamp(s,26,62);
  var needW=BT.cols*(s+gap), needH=BT.rows*(s+gap);
  wrap.classList.toggle('fit',needW<=availW&&needH<=availH);
  document.body.classList.toggle('scrolling',needW>availW||needH>availH);
  wrap.style.setProperty('--cell',s+'px');
  board.style.setProperty('--cell',s+'px');
}

    BT.skill=null;
    if(!ok) blog(BT,'b_skill_no',null);
    renderBattle();
    if(BT.over) finishBattleUI();
    return;
  }
  var u=BT.sel?unitById(BT.sel):null;
  if(u&&u.side===me&&!u.acted){
    var reach=bReach(BT,u), tg=null;
    bTargets(BT,u,u.x,u.y).forEach(function(t2){
      if(t2.kind==='unit'){ if(t2.u.x===x&&t2.u.y===y) tg=t2; }
      else if(t2.x===x&&t2.y===y) tg=t2;
    });
    if(tg){ pushUndoB(); bAttack(BT,u,tg); BT.sel=null; renderBattle(); if(BT.over) finishBattleUI(); else saveGame(true); return; }
    if(reach[key]!==undefined){ pushUndoB(); bMove(BT,u,x,y); sfx('move'); BT.sel=u.id; renderBattle(); revealCell(x,y); saveGame(true); return; }
  }
  var eu=bUnitAt(BT,x,y);
  if(eu&&eu.side===me){ BT.sel=(BT.sel===eu.id)?null:eu.id; sfx(BT.sel?'sel':'unsel'); renderBattle(); return; }
  BT.sel=null; renderBattle();
}

function renderSetupComposition(from,to,count){
  var panel=document.getElementById('compPanel'); if(!panel) return;
  var h='<h3>'+t('setup_comp')+'</h3><div class="compGrid">';
  TKEYS.forEach(function(k){
    h+='<label>'+TYPES[k].n[LANG]+'<input type="number" min="0" max="'+count+'" step="1" value="'+S.ui.comp[k]+'" data-comp="'+k+'"></label>';
  });
  panel.innerHTML=h+'</div><div id="compTotal" class="note"></div>';
  var inputs=panel.querySelectorAll?panel.querySelectorAll('input[data-comp]'):[];
  for(var i=0;i<inputs.length;i++) inputs[i].addEventListener('input',function(){
    var key=this.getAttribute('data-comp'), old=S.ui.comp[key];
    var value=clamp(Math.floor(+this.value||0),0,count), delta=value-old;
    S.ui.comp[key]=value;
    if(delta>0){
      for(var j=0;j<TKEYS.length&&delta>0;j++){
        var other=TKEYS[j];
        if(other===key) continue;
        var moved=Math.min(delta,S.ui.comp[other]);
        S.ui.comp[other]-=moved; delta-=moved;
      }
    }else if(delta<0){
      var fill=key==='inf'?(TKEYS.find(function(k){return k!=='inf';})||'inf'):'inf';
      S.ui.comp[fill]-=delta;
    }
    updateSetupComposition(count);
  });
  updateSetupComposition(count);
}
function updateSetupComposition(count){
  var panel=document.getElementById('compPanel');
  if(panel){
    var inputs=panel.querySelectorAll?panel.querySelectorAll('input[data-comp]'):[];
    for(var i=0;i<inputs.length;i++){
      var key=inputs[i].getAttribute('data-comp');
      inputs[i].value=S.ui.comp[key];
    }
  }
  var total=armyCompTotal(S.ui.comp), label=document.getElementById('compTotal');
  if(label){
    label.textContent=t('setup_comp_total',{n:total,max:count});
    label.style.color=total===count?'':'var(--danger)';
  }
  var go=document.getElementById('setupGo');
  if(go) go.disabled=total!==count;
}
function setupGens(fromKey){
  var out=[];
  GENERALS.forEach(function(g){
    var s=S.gen[g.k];
    if(!s||s.dead||s.side!==S.me||s.pendingCapt) return;
    if(s.city===fromKey) out.push(g.k);
    else if(s.city&&S.cities[s.city]&&S.cities[s.city].owner===S.me&&linkInfo(s.city,fromKey)) out.push(g.k);
  });
  out.sort(function(a,b){ var A=genData(a),B2=genData(b); return (B2.lead*2+B2.war+B2.int)-(A.lead*2+A.war+A.int); });
  return out;
}

        '<button data-fate="hire" data-g="'+gk+'">'+t('fate_hire')+'</button>'+
        '<button data-fate="free" data-g="'+gk+'">'+t('fate_free')+'</button>'+
        '<button class="warn" data-fate="kill" data-g="'+gk+'">'+t('fate_kill')+'</button></div>';
    });
  }
  if(body) body.innerHTML=h;
  var btns=body&&body.querySelectorAll?body.querySelectorAll('button[data-fate]'):[];
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){
    captiveFate(this.getAttribute('data-g'),this.getAttribute('data-fate'));
    showBattleResult();
  });
  var bb=document.getElementById('resBtns');
  if(bb){
    bb.innerHTML='<button class="go" id="resClose">'+t('btn_back')+'</button>';
    var cb=document.getElementById('resClose');
    if(cb) cb.addEventListener('click',function(){
      closeOverlay('resOv');
      var end=checkVictory();
      showScreen('scrCamp'); renderCamp(); fitMap();
      drainNotices();
      if(end) showGameOver(end);
    });
  }
  openOverlay('resOv');
}
var NOTICE_Q=[];
function showEvents(list){ NOTICE_Q=NOTICE_Q.concat(list||[]); drainNotices(); }
function drainNotices(){
  var q=(S&&S.notices)?S.notices.slice():[];
  if(S) S.notices=[];
  var all=q.concat(NOTICE_Q);
  NOTICE_Q=[];
  if(!all.length){
    if(S&&S.pendingBattle&&!S.battle) startPendingBattle();
    return;
  }
  var ev=all[0];
  if(all.length>1) NOTICE_Q=all.slice(1);
  var ti=document.getElementById('evTitle'), bd=document.getElementById('evBody');
  if(ti) ti.textContent=t('ev_title');
  if(bd) bd.innerHTML='<p style="font-size:13px;color:#e8e2cd">'+t(ev.k,ev.p)+'</p>';
  openOverlay('evOv');
}
function showGameOver(end){
  var ti=document.getElementById('endTitle'), bd=document.getElementById('endBody');
  if(ti){ ti.textContent=end.win?t('end_win'):t('end_lose'); ti.className=end.win?'win':'lose'; }
  if(bd){
    var mine=citiesOf(S.me).length;
    bd.innerHTML='<p>'+t(end.reason==='unify'?'end_win_d':'end_lose_d',{y:S.year,n:mine,c:CITIES.length})+'</p>'+
      '<p class="note">'+t('end_stat',{t:S.turn,g:st(S.me).gold,f:st(S.me).food,p:calcPrestige(S.me)})+'</p>';
  }
  PROF.runs=(PROF.runs||0)+1;
  if(end.win) PROF.wins=(PROF.wins||0)+1;
  saveProfile();
  lsDel(LS_S);
  openOverlay('endOv');
}

var SEL_STATE=PROF.state||'wei';
function buildTitleCards(){
  var box=document.getElementById('statePick'); if(!box) return;
  var h='';
  STATES.forEach(function(s){
    var cap=findCity(s.cap);
    h+='<button class="statecard'+(SEL_STATE===s.k?' sel':'')+'" data-st="'+s.k+'">'+
      '<span class="dot" style="background:'+s.col+'"></span>'+
      '<span><span class="nm">'+s.n[LANG]+'</span><span class="cap">'+(s.n[LANG]!==s.n.en?s.n.en+' ／ ':'')+cityName(cap.k)+'</span></span></button>';
  });
  box.innerHTML=h;
  var bs=box.querySelectorAll?box.querySelectorAll('button[data-st]'):[];
  for(var i=0;i<bs.length;i++) bs[i].addEventListener('click',function(){
    SEL_STATE=this.getAttribute('data-st'); sfx('ui'); buildTitleCards(); drawTitleArt();
  });
  var note=document.getElementById('titleNote');
  if(note){
    var sv=loadSave();
    note.textContent=sv? t('note_saved',{s:stateName(sv.me),y:sv.year}) : t('note_nosave');
  }
  var dn=document.getElementById('diffNote');
  if(dn) dn.textContent=t('diff_note_'+PROF.diff);
}
function drawTitleArt(){
  var cv=document.getElementById('titleCanvas'); if(!cv) return;
  var g=cv.getContext('2d'); if(!g) return;
  var W=cv.width, H=cv.height;
  g.clearRect(0,0,W,H);
  var stt=findState(SEL_STATE)||STATES[0];
  function block(x,y,w,h,col){ g.fillStyle=col; g.fillRect(x,y,w,h); }
  var R=seedRnd(4242), i;
  block(0,0,W,H,'#17263a');
  block(0,0,W,20,'#20364d');
  block(0,20,W,15,'#354658');
  block(0,35,W,13,'#6a5747');
  block(0,48,W,24,'#24362b');
  block(0,47,W,3,'#48513a');
  // Evening sky, stepped clouds and a pixel sun.
  block(88,8,12,2,'#e7b969'); block(84,10,20,2,'#e7b969');
  block(88,12,12,2,'#d58b58'); block(91,14,6,2,'#b9634d');
  [[15,8,9],[41,14,13],[71,6,8],[103,22,10]].forEach(function(c){
    block(c[0]+2,c[1]-2,c[2]-4,2,'#9aa5a0');
    block(c[0],c[1],c[2],3,'#778995');
    block(c[0]+3,c[1]+3,c[2]-2,2,'#596d7b');
  });
  for(i=0;i<28;i++){
    var sx=Math.floor(R()*W), sy=Math.floor(R()*28);
    block(sx,sy,1,1,i%3?'#aab2a7':'#d7c08a');
  }
  // Distant ridgelines and pine silhouettes.
  block(0,38,19,3,'#394651'); block(5,35,18,3,'#3c4b56');
  block(91,36,29,4,'#3c4a4b'); block(105,33,15,3,'#465250');
  [[5,42],[15,39],[98,40],[113,37]].forEach(function(p){
    block(p[0]+3,p[1],2,10,'#252f2c');
    block(p[0]+1,p[1]+2,6,2,'#43523a');
    block(p[0],p[1]+4,8,2,'#354735');
    block(p[0]+2,p[1]+6,4,2,'#2d3e31');
  });
  // Castle keep, layered roofs, stonework and lit windows.
  block(31,43,59,9,'#292d31');
  block(34,40,53,4,'#817561'); block(34,41,53,1,'#c0a974');
  for(i=0;i<8;i++){ block(35+i*7,37,4,4,'#756b59'); block(35+i*7,37,4,1,'#c0ad7b'); }
  block(43,30,37,11,'#746a59'); block(46,27,31,4,'#92836a');
  block(48,28,27,1,'#d1b982'); block(49,32,25,2,'#5b5549');
  block(52,22,19,7,'#8a795f'); block(55,20,13,3,'#b69d6e');
  block(57,16,9,5,'#aa9064'); block(59,14,5,3,'#d1b578');
  block(61,11,1,4,'#34302b'); block(59,11,5,1,'#34302b');
  block(58,34,4,4,'#e5bd69'); block(70,34,4,4,'#e5bd69');
  block(59,43,6,9,'#342c27'); block(61,46,2,6,'#ad6843');
  block(37,44,2,5,'#d9c18a'); block(80,44,2,5,'#d9c18a');
  // Stone path leading to the gate.
  block(57,52,10,2,'#77705d'); block(53,54,18,2,'#696653');
  block(48,56,28,2,'#555747'); block(42,58,40,2,'#414b3c');
  // Foreground grass tufts.
  for(i=0;i<20;i++){
    var gx=Math.floor(R()*W), gy=52+Math.floor(R()*19);
    block(gx,gy,1,2,i%2?'#586443':'#707044');
    if(i%3===0) block(gx+1,gy-1,1,1,'#84904d');
  }
  // Soldiers and standards frame the fortress without obscuring it.
  function trooper(px,py,col,dark,scale){
    var z=scale||1;
    block(px,py+5*z,4*z,2*z,'#181d20');
    block(px+z,py+2*z,3*z,3*z,col);
    block(px+z,py+z,3*z,2*z,'#d7b994');
    block(px,py,5*z,z,'#c0b58e');
    block(px+4*z,py-2*z,z,9*z,'#c9c0a8');
    block(px+z,py+3*z,3*z,z,dark);
  }
  var troopXs=[8,20,31,88,99,110];
  for(i=0;i<troopXs.length;i++){
    var red=i>=3, tc=red?'#a44f47':mix(stt.col,-0.08);
    trooper(troopXs[i],53+(i%2),tc,mix(tc,-0.48),i===2||i===3?1:1);
  }
  block(17,43,1,16,'#282b2a'); block(13,42,8,7,stt.col);
  block(14,43,6,1,mix(stt.col,0.42)); block(15,45,4,2,'#eee0b5');
  block(101,39,1,17,'#282b2a'); block(94,40,7,7,'#a44f47');
  block(95,41,5,1,'#d78b67'); block(96,43,3,2,'#e9d2a4');
  // Subtle frame gives the small canvas a finished illustration edge.
  block(0,0,W,1,'#a18a5d'); block(0,H-1,W,1,'#a18a5d');
  block(0,0,1,H,'#a18a5d'); block(W-1,0,1,H,'#a18a5d');
  cv.style.imageRendering='pixelated';
}
function unitTable(){
  var h='<table><tr><th>'+t('th_unit')+'</th><th>'+t('th_move')+'</th><th>'+t('th_range')+'</th><th>'+t('th_atk')+'</th><th>'+t('th_hp')+'</th></tr>';
  TKEYS.forEach(function(k){
    var T=TYPES[k];
    h+='<tr><td>'+T.n[LANG]+'</td><td>'+T.move+'</td><td>'+T.range+'</td><td>'+T.atk+'</td><td>'+T.hp+'</td></tr>';
  });
  return h+'</table>';
}
function skillTable(){
  var h='<table><tr><th>'+t('th_skill')+'</th><th>'+t('th_cost2')+'</th><th>'+t('th_eff')+'</th></tr>';
  ['fire','charge','rally','surprise'].forEach(function(k){
    var S2=SKILLS[k];
    h+='<tr><td>'+S2.n[LANG]+'</td><td>'+S2.cost+'</td><td>'+t('sk_'+k)+'</td></tr>';

}
function devTable(){
  var h='<table><tr><th>'+t('th_act')+'</th><th>'+t('th_cost')+'</th><th>'+t('th_eff')+'</th></tr>';
  ['farms','town','walls','train','recruit','appease'].forEach(function(k){
    h+='<tr><td>'+t('dev_'+k)+'</td><td>'+t('cost_gold')+' '+DEV[k].gold+(DEV[k].men?(' / '+t('cost_men')+' '+DEV[k].men):'')+'</td><td>'+t('devd_'+k)+'</td></tr>';
  });
  return h+'</table>';
}
function fillHelp(){
  var el=document.getElementById('helpBody'); if(!el) return;
  el.innerHTML=t('help_html').split('{units}').join(unitTable()).split('{skills}').join(skillTable()).split('{devs}').join(devTable());
}
function applyLangStatic(){
  if(typeof document==='undefined'||!document.querySelectorAll) return;
  var els=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++){
    var k=els[i].getAttribute('data-i18n');
    if(k) els[i].textContent=t(k);
  }
  document.documentElement.lang=(LANG==='ja')?'ja':(LANG==='zh'?'zh-Hans':'en');
  var dt=document.title;
  document.title=t('app_title');
  var bs=document.getElementById('barBat'); if(bs){}
  var langSel=document.getElementById('langSel'); if(langSel) langSel.value=LANG;
  var diffSel=document.getElementById('diffSel'); if(diffSel) diffSel.value=PROF.diff;
  soundLabels();
}
function setLang(l){
  if(!I18N[l]) return;
  LANG=l; PROF.lang=l; saveProfile();
  applyLangStatic(); fillHelp(); buildTitleCards(); drawTitleArt();
  if(S){ if(S.battleData&&BT){ renderBattle(); } else { renderCamp(); } }
  sfx('ui');
}
function detectLang(){
  if(PROF.lang&&I18N[PROF.lang]) return PROF.lang;
  var nav=(typeof navigator!=='undefined'&&(navigator.language||navigator.userLanguage))||'ja';
  nav=(''+nav).toLowerCase();
  if(nav.indexOf('zh')===0) return 'zh';
  if(nav.indexOf('ja')===0) return 'ja';
  return 'en';
}
function flashSaved(text){
  var el=document.getElementById('saveTag'); if(!el) return;
  el.textContent=text; el.classList.remove('hidden');
  if(typeof setTimeout==='function'){
    if(flashSaved._t) clearTimeout(flashSaved._t);
    flashSaved._t=setTimeout(function(){ el.classList.add('hidden'); },1400);
  }
}
function newGame(){
  closeOverlay('bootOv'); closeOverlay('endOv');
  PROF.state=SEL_STATE; saveProfile();
  newCampaign(SEL_STATE,PROF.diff);
  BT=null;
  showScreen('scrCamp');
  renderCamp(); fitMap();
  sfx('season');
  saveGame(true);
}
function resumeGame(){
  closeOverlay('bootOv');
  if(!S) { newGame(); return; }
  buildAdj(); snapshotInitial();
  if(S.battleData){
    BT=S.battleData;
    showScreen('scrBattle'); buildBoard(); renderBattle();
  }else{
    BT=null;
    showScreen('scrCamp'); renderCamp(); fitMap();
  }
  if(S.over) showGameOver(S.over);
}
function toTitle(){
  S&&saveGame(true);
  SEL_STATE=PROF.state;
  showScreen('scrTitle');
  buildTitleCards(); drawTitleArt();
}
function wire(){
  function on(id,fn){ var e=document.getElementById(id); if(e) e.addEventListener('click',fn); }
  on('startBtn',function(){ unlockAudio(); sfx('ui'); newGame(); });
  on('contBtn',function(){ var sv=loadSave(); if(sv){ S=sv; resumeGame(); } else newGame(); });
  on('wipeBtnT',function(){ wipeAll(); S=null; BT=null; buildTitleCards(); flashSaved(t('wipe_done')); sfx('ui'); });
  on('bootResume',function(){ resumeGame(); });
  on('bootNew',function(){ closeOverlay('bootOv'); showScreen('scrTitle'); });
  on('endAgain',function(){ closeOverlay('endOv'); newGame(); });
  on('endTitleBtn',function(){ closeOverlay('endOv'); S=null; BT=null; toTitle(); });
  on('endSeason',function(){ unlockAudio(); endSeason(); });
  on('saveBtn',function(){ saveGame(false); });
  on('titleBack',function(){ toTitle(); });
  on('helpBtn',function(){ fillHelp(); openOverlay('helpOv'); sfx('ui'); });
  on('closeHelp',function(){ closeOverlay('helpOv'); });
  on('evOk',function(){ closeOverlay('evOv'); drainNotices(); });
  on('sfxBtn',function(){ setSfx(!SND.on); });
  on('bgmBtn',function(){ setBgm(!PROF.bgm); });
  on('rotateGo',function(){ document.body.classList.add('force'); fitMap(); fit(); });
  var ls=document.getElementById('langSel');
  if(ls) ls.addEventListener('change',function(){ setLang(this.value); });
  var ds=document.getElementById('diffSel');
  if(ds) ds.addEventListener('change',function(){ PROF.diff=this.value; saveProfile(); var dn=document.getElementById('diffNote'); if(dn) dn.textContent=t('diff_note_'+PROF.diff); });
  on('endBtn',function(){ playerEndTurn(); });
  on('undoBtn',function(){ undoBattle(); });
  on('retreatBtn',function(){ retreatBattle(); });
  on('skillBtn',function(){
    if(!BT||BT.over) return;
    if(!skillReady(BT,BT.meSide)){ sfx('err'); return; }
    BT.skill=!BT.skill; BT.sel=null;
    sfx('ui'); renderBattle();
  });
  var bd=document.getElementById('board');
  if(bd) bd.addEventListener('click',function(ev){
    var el=ev.target;
    while(el&&el!==bd&&!(el.getAttribute&&el.getAttribute('data-x')!==null)) el=el.parentNode;
    if(!el||el===bd||!el.getAttribute) return;
    var x=+el.getAttribute('data-x'), y=+el.getAttribute('data-y');
    if(isNaN(x)||isNaN(y)) return;
    boardTap(x,y);
  });
  on('setupGo',function(){
    var commit=S.ui.commit, gen=S.ui.gen||null;
    startBattleFromSetup(commit,gen);
  });
  on('setupCancel',function(){ S.ui.pending=null; closeOverlay('setupOv'); renderCamp(); });
  var mc=document.getElementById('mapc');
  if(mc){
    mc.addEventListener('click',onMapTap);
    mc.addEventListener('mousemove',onMapHover);
    mc.addEventListener('mouseleave',function(){ var tp=document.getElementById('mapTip'); if(tp) tp.style.display='none'; });
  }
  if(typeof window!=='undefined'&&window.addEventListener){
    window.addEventListener('resize',function(){ if(SCREEN==='scrCamp') fitMap(); if(SCREEN==='scrBattle') fit(); });
    window.addEventListener('orientationchange',function(){ setTimeout(function(){ fitMap(); fit(); },220); });
    window.addEventListener('pagehide',function(){ if(S&&!S.over) saveGame(true); });
    window.addEventListener('keydown',function(ev){
      var k=ev.key;
      if(SCREEN==='scrBattle'){
        if(k===' '){ ev.preventDefault&&ev.preventDefault(); playerEndTurn(); }
        else if(k==='u'||k==='U') undoBattle();
        else if(k==='Escape'){ if(BT){ BT.sel=null; BT.skill=null; renderBattle(); } }
      }else if(SCREEN==='scrCamp'){
        if(k==='n'||k==='N') endSeason();
        else if(k==='Escape'){ S.ui.mode=null; renderCamp(); }
      }
      if(k==='s'||k==='S'){ if(S&&!S.over) saveGame(false); }
    });
  }
  if(typeof document!=='undefined'&&document.addEventListener){
    document.addEventListener('pointerdown',function(){ unlockAudio(); },{once:true});
  }
}
function boot(){
  loadProfile();
  LANG=detectLang();
  SND.on=(PROF.sound!==false);
  SEL_STATE=findState(PROF.state)?PROF.state:'wei';
  buildAdj(); snapshotInitial(); buildWorld();
  applyLangStatic(); fillHelp(); buildTitleCards(); drawTitleArt(); soundLabels(); wire();
  showScreen('scrTitle');
  var sv=loadSave();
  if(sv&&sv.me&&sv.st&&sv.st[sv.me]&&sv.st[sv.me].alive){
    S=sv; buildAdj(); snapshotInitial();
    var bi=document.getElementById('bootInfo');
    if(bi) bi.textContent=t('boot_info',{s:stateName(S.me),y:S.year,sea:t('sea_'+SEASONS[S.season]),c:citiesOf(S.me).length});
    openOverlay('bootOv');
  }
}
if(typeof document!=='undefined'&&typeof boot==='function'&&!window.__WSR_TESTING__) boot();
